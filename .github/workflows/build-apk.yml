name: Build APK

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug & release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK platform 35
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using Android SDK at: $SDK"
          echo "Platforms: $(ls "$SDK/platforms" | tr '\n' ' ')"
          echo "Build-tools: $(ls "$SDK/build-tools" | tr '\n' ' ')"
          if [ ! -d "$SDK/platforms/android-35" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            echo "Installing missing SDK packages…"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
              --install "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build.log ]; then
            # Surface the key lines as annotations (readable even without log access).
            grep -a -E '^(e: |> Task .*FAILED|FAILURE:|What went wrong|Caused by|Execution failed|AAPT|ERROR)' build.log \
              | tail -10 | while IFS= read -r line; do
                echo "::error title=Gradle::${line:0:900}"
              done
            jq -Rs '{body: ("### ❌ Gradle build log\n```\n" + (.[-12000:]) + "\n```")}' build.log > /tmp/payload.json
            gh api --method POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input /tmp/payload.json || true
          fi

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/IDE-Ultimate-1.0.0-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/IDE-Ultimate-1.0.0-release.apk
          cd dist
          sha256sum *.apk | tee checksums.txt
          ls -lh

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IDE-Ultimate-APK
          path: |
            dist/*.apk
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 90

      - name: Write build summary
        run: |
          {
            echo "## 📱 IDE Ultimate — APK ready"
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in dist/*.apk; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo "Download the APK from the **Artifacts** section of this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/checksums.txt \
            --title "IDE Ultimate $GITHUB_REF_NAME" \
            --generate-notes
